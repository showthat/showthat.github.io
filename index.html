<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SDK 가이드</title>
  <script src="//unpkg.com/docsify/lib/docsify.min.js"></script>
  <script src="//unpkg.com/docsify/lib/plugins/search.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    .app-name {
      font-weight: bold;
      font-size: 24px;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'SDK 가이드',
      loadSidebar: true,
      subMaxLevel: 2,
      search: {
        placeholder: '검색어를 입력하세요',
        noData: '검색 결과가 없습니다'
      }
    }
  </script>
</body>
</html>
